[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dimaggi-offline-receiver"
version = "0.1.0"
description = "Source-bound offline receiver for Maggie's first infrastructure profile"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "PyYAML==6.0.2", "jsonschema==4.26.0"]

[project.scripts]
dimaggi-receiver = "dimaggi_receiver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dimaggi_receiver = ["sources.lock.json", "profile.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
