name: Installed offline receiver
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: receiver-${{ github.ref }}
  cancel-in-progress: true
jobs:
  receiver:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build and install wheel
        run: bash integration/receiver/tools/qualify_offline.sh integration/receiver/requirements-darwin-arm64-py312.lock
      - name: Export exact public source objects
        run: |
          python integration/receiver/tools/ci_export_sources.py
      - name: Installed receiver and source-bound domain tests
        env:
          DIMAGGI_EXPECT_SOURCES: '1'
          DIMAGGI_TEST_SOURCES: ${{ runner.temp }}/receiver-inputs/export
        run: |
          python -m pytest integration/receiver/tests -q \
            --ignore=integration/receiver/tests/test_infrastructure_roundtrip.py \
            --ignore=integration/receiver/tests/test_policy_roundtrip.py \
            --ignore=integration/receiver/tests/test_journal_roundtrip.py \
            --ignore=integration/receiver/tests/test_collection_roundtrip.py \
            --ignore=integration/receiver/tests/test_binding_v2.py \
            --ignore=integration/receiver/tests/test_clock_tolerance.py \
            --ignore=integration/receiver/tests/test_collector_clock_lead.py \
            --ignore=integration/receiver/tests/test_collector_recovery.py \
            --ignore=integration/receiver/tests/test_failure_ownership.py \
            --ignore=integration/receiver/tests/test_heartbeat_suspension.py \
            --ignore=integration/receiver/tests/test_infrastructure.py \
            --ignore=integration/receiver/tests/test_lease_expiry.py \
            --ignore=integration/receiver/tests/test_lease_fencing.py \
            --ignore=integration/receiver/tests/test_lease_lock_descriptor.py \
            --ignore=integration/receiver/tests/test_private_publication.py \
            --ignore=integration/receiver/tests/test_publication_churn.py \
            --ignore=integration/receiver/tests/test_publication_cleanup.py \
            --ignore=integration/receiver/tests/test_publication_clock.py \
            --ignore=integration/receiver/tests/test_publication_evidence.py \
            --ignore=integration/receiver/tests/test_publication_failure.py \
            --ignore=integration/receiver/tests/test_reader_availability.py \
            --ignore=integration/receiver/tests/test_reader_branches.py \
            --ignore=integration/receiver/tests/test_reader_clock.py \
            --ignore=integration/receiver/tests/test_reader_future.py \
            --ignore=integration/receiver/tests/test_reader_ledger.py \
            --ignore=integration/receiver/tests/test_reader_lock_order.py \
            --ignore=integration/receiver/tests/test_reader_renewal.py \
            --ignore=integration/receiver/tests/test_reader_tombstone_reason.py \
            --ignore=integration/receiver/tests/test_retirement_lifecycle.py \
            --ignore=integration/receiver/tests/test_runtime_placement.py \
            --ignore=integration/receiver/tests/test_snapshot_publication.py \
            --ignore=integration/receiver/tests/test_startup_procfs.py \
            --ignore=integration/receiver/tests/test_trust_limits.py \
            --ignore=integration/receiver/tests/test_watch_current.py \
            --junitxml "$RUNNER_TEMP/receiver-tests.xml"
          python integration/receiver/tools/check_acceptance.py "$RUNNER_TEMP/receiver-tests.xml" integration/receiver/src/dimaggi_receiver/sources.lock.json receiver-darwin

  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            lock: requirements-linux-x86_64-py312.lock
          - runner: ubuntu-24.04-arm
            lock: requirements-linux-aarch64-py312.lock
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build and install wheel
        run: bash integration/receiver/tools/qualify_offline.sh integration/receiver/${{ matrix.lock }}
      - name: Export exact public source objects
        run: |
          python integration/receiver/tools/ci_export_sources.py
      - name: Installed receiver and source-bound domain tests
        env:
          DIMAGGI_EXPECT_SOURCES: '1'
          DIMAGGI_TEST_SOURCES: ${{ runner.temp }}/receiver-inputs/export
        run: |
          python -m pytest integration/receiver/tests -q \
            --ignore=integration/receiver/tests/test_infrastructure_roundtrip.py \
            --ignore=integration/receiver/tests/test_policy_roundtrip.py \
            --ignore=integration/receiver/tests/test_journal_roundtrip.py \
            --ignore=integration/receiver/tests/test_collection_roundtrip.py \
            --junitxml "$RUNNER_TEMP/receiver-tests.xml"
          python integration/receiver/tools/check_acceptance.py "$RUNNER_TEMP/receiver-tests.xml" integration/receiver/src/dimaggi_receiver/sources.lock.json
