name: Evidence provenance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: |
          python -m pip download --require-hashes --only-binary=:all: -r integration/receiver/requirements-linux-x86_64-py312.lock --dest "$RUNNER_TEMP/wheels" --timeout 30 --retries 2
          python -m pip install --no-index --find-links "$RUNNER_TEMP/wheels" --require-hashes -r integration/receiver/requirements-linux-x86_64-py312.lock
      - run: python tools/validate_evidence.py evidence.json
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python -m pytest tools -q
