name: Pinned first-decision contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  first-decision:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MAGGIE_REPOS_ROOT: ${{ runner.temp }}/first-decision-sources
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install locked test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r integration/receiver/requirements-linux-x86_64-py312.lock
      - name: Check out exact model commits
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import runpy
          import subprocess
          pins = runpy.run_path("integration/first_decision/reference.py")["PINS"]
          root = Path(os.environ["MAGGIE_REPOS_ROOT"])
          root.mkdir()
          for name, commit in pins.items():
              target = root / name
              subprocess.run(["git", "init", str(target)], check=True)
              subprocess.run(["git", "-C", str(target), "fetch", "--depth=1",
                              f"https://github.com/dimaggi-ai/{name}.git", commit], check=True)
              subprocess.run(["git", "-C", str(target), "checkout", "--detach", "FETCH_HEAD"], check=True)
          PY
      - name: Validate pinned models and refusal contract
        run: python -m pytest integration/first_decision -q
